name: DevPilot review

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: ['**', '!devpilot/fix-**', '!devpilot/setup-review']
  workflow_dispatch:
    inputs:
      operation:
        description: Review the current default branch or approve an existing proposal
        type: choice
        options: [baseline, approve]
        required: true
      review_run:
        description: Review run ID (approval only)
        type: string
      proposal_digest:
        description: Proposal SHA-256 from the review (approval only)
        type: string

permissions: {}

concurrency:
  group: devpilot-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}-${{ github.event.inputs.review_run || '' }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

jobs:
  review:
    if: github.event_name != 'workflow_dispatch' || (github.event.inputs.operation == 'baseline' && github.ref_name == github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
    steps:
      # Run only the trusted DevPilot implementation, never code from the PR or push.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: ./
        with:
          provider: ${{ secrets.GEMINI_API_KEY != '' && 'gemini' || 'mock' }}
          gemini-api-key: ${{ secrets.GEMINI_API_KEY }}
          propose-fixes: 'true'

  approve:
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.operation == 'approve' && github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
      pull-requests: write
    steps:
      # Run only the trusted DevPilot implementation, never code from the PR or push.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: ./
