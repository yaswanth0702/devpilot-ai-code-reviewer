[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "devpilot-agent"
version = "1.0.0"
description = "LLM agent that reviews code changes locally or on GitHub pull requests"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "httpx>=0.27",
  "pydantic>=2.6",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
devpilot = "devpilot_agent.cli:main"

[tool.setuptools.packages.find]
include = ["devpilot_agent*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
